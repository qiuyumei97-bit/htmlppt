<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形认识</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        .triangle-showcase {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .triangle-card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
        }
        .triangle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .triangle-card h3 {
            margin: 15px 0 10px 0;
        }
        .triangle-card p {
            font-size: 0.9rem;
            color: #666;
        }
        .triangle-shape {
            width: 0;
            height: 0;
            margin: 0 auto;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
        }
        .equilateral .triangle-shape {
            border-bottom: 87px solid #ff6b6b;
        }
        .isosceles .triangle-shape {
            border-bottom: 70px solid #4ecdc4;
            border-left-width: 60px;
            border-right-width: 60px;
        }
        .scalene .triangle-shape {
            border-bottom: 75px solid #ffe66d;
            border-left-width: 40px;
            border-right-width: 70px;
        }
        .properties {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: left;
        }
        .properties h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        .properties ul {
            list-style: none;
            padding: 0;
        }
        .properties li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            position: relative;
            padding-left: 25px;
        }
        .properties li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4ecdc4;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔺 三角形认识</h1>
        <div class="triangle-showcase">
            <div class="triangle-card equilateral">
                <div class="triangle-shape"></div>
                <h3>等边三角形</h3>
                <p>三条边长度相等</p>
            </div>
            <div class="triangle-card isosceles">
                <div class="triangle-shape"></div>
                <h3>等腰三角形</h3>
                <p>两条边长度相等</p>
            </div>
            <div class="triangle-card scalene">
                <div class="triangle-shape"></div>
                <h3>不等边三角形</h3>
                <p>三条边长度都不相等</p>
            </div>
        </div>
        <div class="properties">
            <h3>三角形的性质</h3>
            <ul>
                <li>三角形内角和等于180度</li>
                <li>任意两边之和大于第三边</li>
                <li>三角形具有稳定性</li>
                <li>三角形面积 = 底 × 高 ÷ 2</li>
            </ul>
        </div>
    </div>
    <script>
        window.play = function() {
            const cards = document.querySelectorAll('.triangle-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        card.style.transform = 'scale(1)';
                    }, 300);
                }, index * 500);
            });
        };
        window.pause = function() {};
        window.prev = function() {};
        window.next = function() {};
    </script>
</body>
</html>

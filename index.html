<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML课件库</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="home-page">
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>HTML课件库</span>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html" class="active"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="#grades"><i class="fas fa-layer-group"></i> 年级分类</a></li>
                    <li><a href="manage.html"><i class="fas fa-cog"></i> 管理后台</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container">
                <h1>欢迎使用HTML课件库</h1>
                <p>提供优质的教育课件资源，支持在线浏览和播放</p>
                <a href="#grades" class="btn btn-primary">浏览课件</a>
            </div>
        </section>

        <section id="grades" class="grades-section">
            <div class="container">
                <h2 class="section-title">年级分类</h2>
                <div class="grades-grid" id="gradesGrid">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="featured-section">
            <div class="container">
                <h2 class="section-title">最新课件</h2>
                <div class="courses-grid" id="coursesGrid">
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>暂无课件，请先添加</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 HTML课件库 - 让教学更简单</p>
        </div>
    </footer>

    <script src="js/main.js?v=2"></script>
</body>
</html>

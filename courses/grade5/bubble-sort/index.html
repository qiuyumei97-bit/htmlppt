    &lt;div class=&quot;page-title&quot;&gt;互动体验：冒泡排序可视化&lt;/div&gt;
    &lt;div class=&quot;viz-container&quot;&gt;
      &lt;div class=&quot;status-text&quot; id=&quot;status&quot;&gt;拖拽柱子调整顺序，或点击&ldquo;单步执行&rdquo;观察排序&lt;/div&gt;
      &lt;div class=&quot;array-container&quot; id=&quot;array-container&quot; data-interactive&gt;
        &lt;!-- 柱状图动态生成 --&gt;
      &lt;/div&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;button id=&quot;step-btn&quot; class=&quot;btn-primary&quot;&gt;单步执行&lt;/button&gt;
        &lt;button id=&quot;reset-btn&quot; class=&quot;px-6 py-2 border-2 border-gray-300 rounded-full hover:bg-gray-100 transition-colors&quot;&gt;重置&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    const container = document.getElementById('array-container');
    const statusEl = document.getElementById('status');
    const stepBtn = document.getElementById('step-btn');
    const resetBtn = document.getElementById('reset-btn');
    
    let data = [65, 90, 35, 50, 20, 80];
    let i = 0, j = 0;
    let sortedCount = 0;

    function render() {
      container.innerHTML = '';
      data.forEach((val, index) =&gt; {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = (val * 2) + 'px';
        bar.textContent = val;
        bar.draggable = true;
        bar.dataset.index = index;
        bar.dataset.interactive = true;
        
        if (index &gt;= data.length - sortedCount) {
          bar.classList.add('sorted');
        }
        
        bar.addEventListener('dragstart', handleDragStart);
        bar.addEventListener('dragover', handleDragOver);
        bar.addEventListener('drop', handleDrop);
        bar.addEventListener('dragend', handleDragEnd);
        
        container.appendChild(bar);
      });
    }

    let dragSrcIndex = null;
    function handleDragStart(e) {
      this.classList.add('dragging');
      dragSrcIndex = this.dataset.index;
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) {
      e.preventDefault();
    }
    function handleDrop(e) {
      e.stopPropagation();
      const targetIndex = this.dataset.index;
      if (dragSrcIndex !== targetIndex) {
        const temp = data[dragSrcIndex];
        data[dragSrcIndex] = data[targetIndex];
        data[targetIndex] = temp;
        resetSortState();
        render();
        saveMyState();
      }
    }
    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    function resetSortState() {
      i = 0; j = 0; sortedCount = 0;
      statusEl.textContent = &quot;顺序已调整，点击&ldquo;单步执行&rdquo;开始&quot;;
    }

    async function step() {
      if (sortedCount &gt;= data.length - 1) {
        statusEl.textContent = &quot;排序已完成！&quot;;
        return;
      }

      const bars = document.querySelectorAll('.bar');
      bars.forEach(b =&gt; b.classList.remove('comparing'));
      
      const b1 = bars[j];
      const b2 = bars[j+1];
      b1.classList.add('comparing');
      b2.classList.add('comparing');
      
      statusEl.textContent = `比较相邻元素：${data[j]} 和 ${data[j+1]}`;

      if (data[j] &gt; data[j+1]) {
        await new Promise(resolve =&gt; { setTimeout(resolve, 400); });
        statusEl.textContent = `${data[j]} &gt; ${data[j+1]}，交换位置`;
        
        const x1 = b1.offsetLeft;
        const x2 = b2.offsetLeft;
        const dist = x2 - x1;
        
        await anime({
          targets: b1,
          translateX: dist,
          duration: 400,
          easing: 'easeInOutQuad'
        }).finished;
        
        const temp = data[j];
        data[j] = data[j+1];
        data[j+1] = temp;
        render();
      } else {
        await new Promise(resolve =&gt; { setTimeout(resolve, 600); });
        statusEl.textContent = `${data[j]} &lt;= ${data[j+1]}，保持不变`;
      }

      let nextJ = j + 1;
      let nextI = i;
      if (nextJ &gt;= data.length - 1 - nextI) {
        nextJ = 0;
        nextI = i + 1;
      }
      
      j = nextJ;
      i = nextI;
      sortedCount = nextI;
      
      if (nextJ === 0) {
        render();
      }
      saveMyState();
    }

    stepBtn.onclick = step;
    resetBtn.onclick = () =&gt; {
      data = [65, 90, 35, 50, 20, 80];
      resetSortState();
      render();
      saveMyState();
    };

    function saveMyState() {
      window.parent.postMessage({
        type: 'saveState',
        state: { data, i, j, sortedCount }
      }, '*');
    }

    window.addEventListener('message', (e) =&gt; {
      if (e.data &amp;&amp; e.data.type === 'restoreState' &amp;&amp; e.data.state) {
        const s = e.data.state;
        data = s.data; i = s.i; j = s.j; sortedCount = s.sortedCount;
        render();
      }
    });

    render();
  &lt;/script&gt;
&lt;/template&gt;

        &lt;pre&gt;
def bubble_sort(arr):
    n = len(arr)
    for i in &lt;span class=&quot;drop-zone&quot; data-answer=&quot;range(n - 1)&quot; data-interactive&gt;&lt;/span&gt;:
        for j in &lt;span class=&quot;drop-zone&quot; data-answer=&quot;range(n - 1 - i)&quot; data-interactive&gt;&lt;/span&gt;:
            if &lt;span class=&quot;drop-zone&quot; data-answer=&quot;arr[j] &gt; arr[j + 1]&quot; data-interactive&gt;&lt;/span&gt;:
                arr[j], arr[j+1] = arr[j+1], arr[j]
    return arr
        &lt;/pre&gt;

        &lt;div class=&quot;drag-item&quot; draggable=&quot;true&quot; data-code=&quot;arr[j] &gt; arr[j + 1]&quot; data-interactive&gt;arr[j] &gt; arr[j + 1]&lt;/div&gt;
        &lt;div class=&quot;drag-item&quot; draggable=&quot;true&quot; data-code=&quot;range(n)&quot; data-interactive&gt;range(n)&lt;/div&gt;

    const dropZones = document.querySelectorAll('.drop-zone');
    const feedback = document.getElementById('feedback');
    
    let correctCount = 0;
    const totalNeeded = 3;

    dragItems.forEach(item =&gt; {
      item.addEventListener('dragstart', (e) =&gt; {
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain', item.dataset.code);

      item.addEventListener('dragend', () =&gt; {
        item.classList.remove('dragging');

        zone.classList.add('hover');

        zone.classList.remove('hover');
      });
      zone.addEventListener('drop', (e) =&gt; {
        e.preventDefault();
        zone.classList.remove('hover');
        const code = e.dataTransfer.getData('text/plain');
        
        if (zone.dataset.answer === code) {
          if (!zone.classList.contains('correct')) {
            zone.classList.add('correct');
            zone.textContent = code;
            zone.style.color = '#10b981';
            showFeedback('正确！', '#10b981');
            correctCount++;
            if (correctCount === totalNeeded) {
              setTimeout(() =&gt; {

  &lt;div class=&quot;page-container&quot;&gt;
    &lt;div class=&quot;page-title&quot;&gt;算法实验室：全自动运行演示&lt;/div&gt;
    &lt;div class=&quot;lab-layout&quot;&gt;
      &lt;div class=&quot;viz-panel&quot;&gt;
        &lt;div class=&quot;bar-container&quot; id=&quot;lab-bars&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;stats&quot;&gt;
          &lt;div&gt;比较次数: &lt;span id=&quot;comp-count&quot; class=&quot;text-blue-600&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;交换次数: &lt;span id=&quot;swap-count&quot; class=&quot;text-orange-600&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;flex gap-4&quot;&gt;
          &lt;button id=&quot;gen-btn&quot; class=&quot;flex-1 py-3 bg-gray-200 rounded-xl font-bold hover:bg-gray-300 transition-colors&quot;&gt;随机生成数列&lt;/button&gt;
          &lt;button id=&quot;run-btn&quot; class=&quot;flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-colors&quot;&gt;开始执行排序&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;code-panel&quot;&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-1&quot;&gt;def bubble_sort(arr):&lt;/div&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-2&quot;&gt;&amp;nbsp;&amp;nbsp;n = len(arr)&lt;/div&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-3&quot;&gt;&amp;nbsp;&amp;nbsp;for i in range(n - 1):&lt;/div&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-4&quot;&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;for j in range(n - 1 - i):&lt;/div&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-5&quot;&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;if arr[j] &gt; arr[j+1]:&lt;/div&gt;
        &lt;div class=&quot;code-line&quot; id=&quot;line-6&quot;&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;arr[j], arr[j+1] = arr[j+1], arr[j]&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    const barBox = document.getElementById('lab-bars');
    const compEl = document.getElementById('comp-count');
    const swapEl = document.getElementById('swap-count');
    const genBtn = document.getElementById('gen-btn');
    const runBtn = document.getElementById('run-btn');
    
    let arr = [];
    let comps = 0;
    let swaps = 0;
    let isRunning = false;

    function generate() {
      if (isRunning) return;
      arr = Array.from({length: 10}, () =&gt; Math.floor(Math.random() * 90) + 10);
      comps = 0; swaps = 0;
      updateUI();
    }

    function updateUI(activeIdx = [], sortedIdx = -1) {
      barBox.innerHTML = '';
      arr.forEach((val, idx) =&gt; {
        const bar = document.createElement('div');
        bar.className = 'lab-bar';
        bar.style.height = (val * 1.8) + 'px';
        bar.textContent = val;
        if (activeIdx.includes(idx)) bar.classList.add('active');
        if (sortedIdx !== -1 &amp;&amp; idx &gt;= arr.length - sortedIdx) bar.classList.add('sorted');
        barBox.appendChild(bar);
      });
      compEl.textContent = comps;
      swapEl.textContent = swaps;
    }

    function highlightLine(lineNum) {
      document.querySelectorAll('.code-line').forEach(l =&gt; l.classList.remove('active'));
      if (lineNum) document.getElementById('line-' + lineNum).classList.add('active');
    }

    async function runSort() {
      if (isRunning || arr.length === 0) return;
      isRunning = true;
      runBtn.disabled = true;
      genBtn.disabled = true;
      
      const n = arr.length;
      highlightLine(2);
      await new Promise(r =&gt; setTimeout(r, 400));

      for (let i = 0; i &lt; n - 1; i++) {
        highlightLine(3);
        await new Promise(r =&gt; setTimeout(r, 400));
        for (let j = 0; j &lt; n - 1 - i; j++) {
          highlightLine(4);
          updateUI([j, j+1], i);
          await new Promise(r =&gt; setTimeout(r, 300));
          
          highlightLine(5);
          comps++;
          updateUI([j, j+1], i);
          await new Promise(r =&gt; setTimeout(r, 300));
          
          if (arr[j] &gt; arr[j+1]) {
            highlightLine(6);
            swaps++;
            [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
            updateUI([j, j+1], i);
            await new Promise(r =&gt; setTimeout(r, 400));
          }
        }
      }
      
      highlightLine(null);
      updateUI([], n);
      isRunning = false;
      runBtn.disabled = false;
      genBtn.disabled = false;
    }

    genBtn.onclick = generate;
    runBtn.onclick = runSort;
    generate();
  &lt;/script&gt;
&lt;/template&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击立即体验的埋点
     */

      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>

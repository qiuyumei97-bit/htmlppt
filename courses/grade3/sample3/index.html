<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法口诀表</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .multiplication-table {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
        }
        .table-row {
            display: flex;
        }
        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .cell:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        .cell.header {
            background: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }
        .description {
            margin-top: 30px;
            font-size: 1.2rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✖️ 乘法口诀表</h1>
        <div class="multiplication-table" id="table">
        </div>
        <div class="description">
            <p>点击表格中的数字可以看到乘法运算过程哦！</p>
        </div>
    </div>
    <script>
        const table = document.getElementById('table');
        
        function generateTable() {
            let html = '<div class="table-row"><div class="cell header">×</div>';
            for (let i = 1; i <= 9; i++) {
                html += `<div class="cell header">${i}</div>`;
            }
            html += '</div>';
            
            for (let i = 1; i <= 9; i++) {
                html += `<div class="table-row"><div class="cell header">${i}</div>`;
                for (let j = 1; j <= 9; j++) {
                    const product = i * j;
                    html += `<div class="cell" onclick="showResult(${i}, ${j}, ${product})">${product}</div>`;
                }
                html += '</div>';
            }
            table.innerHTML = html;
        }
        
        function showResult(a, b, result) {
            alert(`${a} × ${b} = ${result}`);
        }
        
        generateTable();
        
        window.play = function() {
            const cells = document.querySelectorAll('.cell:not(.header)');
            cells.forEach((cell, index) => {
                setTimeout(() => {
                    cell.style.background = 'rgba(255,255,255,0.4)';
                    setTimeout(() => {
                        cell.style.background = '';
                    }, 200);
                }, index * 50);
            });
        };
        window.pause = function() {};
        window.prev = function() {};
        window.next = function() {};
    </script>
</body>
</html>

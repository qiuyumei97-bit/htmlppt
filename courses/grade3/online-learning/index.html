        &lt;/div&gt;
        &lt;div class=&quot;drop-zone p-6 border-2 border-dashed border-gray-300 rounded-2xl flex items-center justify-center gap-4&quot; data-interactive data-id=&quot;dict&quot;&gt;
          &lt;div class=&quot;w-12 h-12 bg-purple-500 rounded-lg flex items-center justify-center text-white text-2xl&quot;&gt;📖&lt;/div&gt;
          &lt;span class=&quot;text-lg font-bold&quot;&gt;在线词典&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div id=&quot;feedback&quot; class=&quot;mt-10 text-center text-2xl font-bold hidden&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;style&gt;
    .drag-item.dragging { opacity: 0.5; transform: scale(1.05); }
    .drop-zone.hover { border-color: #3b82f6; background-color: #eff6ff; }
    .drop-zone.correct { border-color: #10b981; background-color: #ecfdf5; border-style: solid; }
  &lt;/style&gt;
  &lt;script&gt;
    let score = 0;
    const items = document.querySelectorAll('.drag-item');
    const zones = document.querySelectorAll('.drop-zone');
    let currentItem = null;

    items.forEach(item =&gt; {
      item.addEventListener('dragstart', () =&gt; {
        item.classList.add('dragging');
        currentItem = item;
      });
      item.addEventListener('dragend', () =&gt; {
        item.classList.remove('dragging');
      });
    });

    zones.forEach(zone =&gt; {
      zone.addEventListener('dragover', e =&gt; {
        e.preventDefault();
        zone.classList.add('hover');
      });
      zone.addEventListener('dragleave', () =&gt; {
        zone.classList.remove('hover');
      });
      zone.addEventListener('drop', () =&gt; {
        zone.classList.remove('hover');
        if (currentItem.dataset.target === zone.dataset.id) {
          zone.classList.add('correct');
          currentItem.style.visibility = 'hidden';
          score++;
          checkWin();
        } else {
          anime({
            targets: currentItem,
            translateX: [10, -10, 10, -10, 0],
            duration: 400,
            easing: 'easeInOutQuad'
          });
        }
      });
    });

    function checkWin() {
      if (score === 3) {
        const fb = document.getElementById('feedback');
        fb.innerText = &quot;🎉 太棒了！你已经掌握了这些工具的用途！&quot;;
        fb.classList.remove('hidden');
        fb.classList.add('text-green-600');
        anime({
          targets: '#feedback',
          scale: [0.5, 1],
          opacity: [0, 1],
          duration: 800,
          easing: 'easeOutElastic(1, .8)'
        });
        saveState();
      }
    }

    function saveState() {
      window.parent.postMessage({ type: 'saveState', state: { score: score } }, '*');
    }

    window.addEventListener('message', e =&gt; {
      if (e.data &amp;&amp; e.data.type === 'restoreState' &amp;&amp; e.data.state.score === 3) {
        score = 3;
        items.forEach(i =&gt; i.style.visibility = 'hidden');
        zones.forEach(z =&gt; z.classList.add('correct'));
        const fb = document.getElementById('feedback');
        fb.innerText = &quot;🎉 太棒了！你已经掌握了这些工具的用途！&quot;;
        fb.classList.remove('hidden');
        fb.classList.add('text-green-600');
      }
    });
  &lt;/script&gt;
&lt;/template&gt;

&lt;template class=&quot;page-data&quot; data-id=&quot;11&quot; data-name=&quot;互动：安全情景大测试 (1)&quot;&gt;
  &lt;div class=&quot;page-container&quot;&gt;
    &lt;h2 class=&quot;page-title&quot;&gt;安全情景大测试 (1)&lt;/h2&gt;
    &lt;div class=&quot;card p-8 space-y-8&quot;&gt;
      &lt;div class=&quot;text-2xl font-bold text-center&quot;&gt;
        情景：你在玩游戏时，收到一条私信：&ldquo;小朋友，恭喜你获得绝版皮肤，请点击下方链接领取。&rdquo;
      &lt;/div&gt;
      &lt;div class=&quot;grid grid-cols-2 gap-6&quot;&gt;
        &lt;button class=&quot;btn p-6 text-xl border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50&quot; onclick=&quot;testFeedback(false, this)&quot;&gt;
          A. 太好了！赶紧点击链接领取。
        &lt;/button&gt;
        &lt;button class=&quot;btn p-6 text-xl border-2 border-gray-200 hover:border-green-500 hover:bg-green-50&quot; onclick=&quot;testFeedback(true, this)&quot;&gt;
          B. 可能是陷阱，不点击，并告诉家长。
        &lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;test-feedback-1&quot; class=&quot;text-center p-6 rounded-2xl hidden&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    function testFeedback(isCorrect, el) {
      const fb = document.getElementById('test-feedback-1');
      fb.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      if (isCorrect) {
        fb.innerText = &quot;✅ 正确！你很有安全意识。不明链接往往隐藏着病毒或诈骗信息。&quot;;
        fb.classList.add('bg-green-100', 'text-green-700');
        el.classList.add('bg-green-500', 'text-white', 'border-green-500');
      } else {
        fb.innerText = &quot;❌ 危险！这通常是网络诈骗。点击链接可能会导致账号被盗或个人信息泄露。&quot;;
        fb.classList.add('bg-red-100', 'text-red-700');
        el.classList.add('bg-red-500', 'text-white', 'border-red-500');
      }
      anime({
        targets: '#test-feedback-1',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 500,
        easing: 'easeOutExpo'
      });
      saveTestState(isCorrect);
    }
    function saveTestState(correct) {
      window.parent.postMessage({ type: 'saveState', state: { answered: true, correct: correct } }, '*');
    }
    window.addEventListener('message', e =&gt; {
      if (e.data &amp;&amp; e.data.type === 'restoreState' &amp;&amp; e.data.state.answered) {
        const state = e.data.state;
        const buttons = document.querySelectorAll('.btn');
        testFeedback(state.correct, state.correct ? buttons[1] : buttons[0]);
      }
    });
  &lt;/script&gt;
&lt;/template&gt;

      &lt;div class=&quot;drop-basket p-6 border-4 border-dashed border-green-300 rounded-3xl flex flex-col items-center gap-4&quot; data-interactive data-id=&quot;safe&quot;&gt;
        &lt;div class=&quot;text-5xl&quot;&gt;🛡️&lt;/div&gt;

        &lt;div class=&quot;text-5xl&quot;&gt;⚠️&lt;/div&gt;
        &lt;span class=&quot;text-xl font-bold text-red-600&quot;&gt;危险篮子&lt;/span&gt;
        &lt;div class=&quot;basket-content flex flex-wrap gap-2 justify-center&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div id=&quot;final-feedback&quot; class=&quot;mt-6 text-center hidden&quot;&gt;
      &lt;img src=&quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/KWWMbLSx4Kx8EgxN263fTD.jpg&quot; class=&quot;w-20 mx-auto mb-2&quot; alt=&quot;勋章&quot;&gt;
      &lt;p class=&quot;text-2xl font-bold text-blue-600&quot;&gt;恭喜你获得&ldquo;安全小卫士&rdquo;勋章！&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;style&gt;
    .drag-item-s.dragging { opacity: 0.5; }
    .drop-basket.hover { background-color: rgba(0,0,0,0.05); }
  &lt;/style&gt;
  &lt;script&gt;
    let correctCount = 0;
    const sItems = document.querySelectorAll('.drag-item-s');
    const baskets = document.querySelectorAll('.drop-basket');
    let activeItem = null;

    sItems.forEach(item =&gt; {
      item.addEventListener('dragstart', () =&gt; {
        item.classList.add('dragging');
        activeItem = item;
      });
      item.addEventListener('dragend', () =&gt; item.classList.remove('dragging'));
    });

    baskets.forEach(basket =&gt; {
      basket.addEventListener('dragover', e =&gt; {
        e.preventDefault();
        basket.classList.add('hover');
      });
      basket.addEventListener('dragleave', () =&gt; basket.classList.remove('hover'));
      basket.addEventListener('drop', () =&gt; {
        basket.classList.remove('hover');
        if (activeItem.dataset.type === basket.dataset.id) {
          basket.querySelector('.basket-content').appendChild(activeItem);
          activeItem.setAttribute('draggable', 'false');
          activeItem.classList.remove('cursor-move');
          activeItem.classList.add('bg-gray-50', 'border-gray-100');
          correctCount++;
          if (correctCount === 4) {
            document.getElementById('final-feedback').classList.remove('hidden');
            anime({
              targets: '#final-feedback',
              scale: [0.5, 1],
              opacity: [0, 1],
              duration: 1000,
              easing: 'easeOutElastic(1, .8)'
            });
          }
        } else {
          anime({
            targets: activeItem,
            translateX: [10, -10, 10, -10, 0],
            duration: 400
          });
        }
      });
    });
  &lt;/script&gt;
&lt;/template&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击飞象老师 Logo 的埋点
     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>

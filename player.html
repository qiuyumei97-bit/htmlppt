<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课件播放 - HTML课件库</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="player-page">
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>HTML课件库</span>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="index.html#grades"><i class="fas fa-layer-group"></i> 年级分类</a></li>
                    <li><a href="manage.html"><i class="fas fa-cog"></i> 管理后台</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="player-section" id="playerContainer">
            <div class="container">
                <div class="player-wrapper">
                    <div class="player-header">
                        <h2 class="course-title">课件标题</h2>
                        <div class="player-header-actions">
                            <span class="course-grade">年级</span>
                            <button id="fullscreenBtn" class="control-btn" title="全屏">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    </div>
                    <div id="courseContent" class="course-content">
                        <div class="loading-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>正在加载课件...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 HTML课件库 - 让教学更简单</p>
        </div>
    </footer>

    <script src="js/main.js?v=2"></script>
</body>
</html>

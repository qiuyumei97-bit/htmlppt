<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课件列表 - HTML课件库</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="courses-page">
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>HTML课件库</span>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="index.html#grades"><i class="fas fa-layer-group"></i> 年级分类</a></li>
                    <li><a href="manage.html"><i class="fas fa-cog"></i> 管理后台</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="page-header">
            <div class="container">
                <h1><i class="fas fa-folder-open"></i> <span class="current-grade">全部课件</span></h1>
                <p>浏览并选择要播放的课件</p>
            </div>
        </section>

        <section class="courses-section">
            <div class="container">
                <div class="filter-bar">
                    <select id="gradeFilter" class="filter-select">
                        <option value="">全部年级</option>
                    </select>
                </div>
                <div class="courses-grid" id="coursesGrid">
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>暂无课件</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 HTML课件库 - 让教学更简单</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
